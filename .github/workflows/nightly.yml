# Nightly builds of `main`: a rolling prerelease tagged `nightly`, replaced
# each night that `main` has moved, and never marked "latest". These are not
# releases. A release is tagged by hand from a full gate run (AGENTS.md,
# "Releasing").
#
# The archives are `cargo xtask dist --no-backend`'s: `kg` and `kanagawa`,
# the standard library and `kg board`'s platforms, without the C++ code
# generator. Like CI, nothing here builds the backend or the reference:
# LLVM, MLIR and CIRCT do not build on the free runners in time, or in their
# memory (journal, 2026-10-11).
#
# The notes say what changed since the last nightly (scripts/nightly_notes.py).
# The tag moves only when one is published, so a night that failed to build
# leaves its changes to the next night's list.
#
# A pull request that changes this file, the notes or the archive's layout
# builds the archives and smoke-tests them, and publishes nothing; the archives
# are kept as the run's artifacts, and the list is in the run's summary.
#
# Actions are pinned by commit, their release named beside it.
name: Nightly

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/nightly.yml
      - crates/kg-cli/build.rs
      - scripts/nightly_notes.py
      - xtask/src/dist.rs

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  # A pull request's superseded run is dropped; a night's run on `main` is
  # never cut off between deleting the old prerelease and making the new.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    name: what to build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      build: ${{ steps.plan.outputs.build }}
      version: ${{ steps.plan.outputs.version }}
      sha: ${{ steps.plan.outputs.sha }}
      changes: ${{ steps.plan.outputs.changes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          base=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          version="$base-nightly.$(date -u +%Y%m%d)+$(git rev-parse --short=7 HEAD)"
          build=true
          # Cleared on failure: with no such tag, `gh` still prints the 404's
          # JSON on stdout, which would read as a commit to compare from.
          last=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/nightly" --jq .object.sha 2>/dev/null) || last=
          # A scheduled night with nothing new on `main` builds nothing.
          if [[ $GITHUB_EVENT_NAME == schedule && $last == "$sha" ]]; then
            build=false
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "$version at $sha: build=$build"
          if [[ $build == true ]]; then
            changes=$(python3 -B scripts/nightly_notes.py "$GITHUB_REPOSITORY" "$last" "$sha")
            # Random, so that no commit's subject can end the value early.
            delimiter=$(openssl rand -hex 16)
            {
              echo "changes<<$delimiter"
              echo "$changes"
              echo "$delimiter"
            } >> "$GITHUB_OUTPUT"
            echo "$changes" >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    name: archive (${{ matrix.target }})
    needs: plan
    if: needs.plan.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux on the older LTS, so the binaries run on glibc 2.35 and later.
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-15, target: aarch64-apple-darwin }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      # What `kg --version` reports (kg-cli's `VERSION`).
      KG_VERSION: ${{ needs.plan.outputs.version }}
      ARCHIVE: kgrust-nightly-${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # third_party/kanagawa only: the library and the runtime RTL the
          # archive carries. Its own submodules are the backend build's.
          submodules: true
      - name: Toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # The `ship` profile's dependencies, apart from CI's `quick` ones.
          prefix-key: nightly
          key: ${{ hashFiles('Cargo.toml', '.cargo/config.toml') }}
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Archive
        run: cargo xtask dist --no-backend --label nightly
      - name: Smoke test, unpacked outside the checkout
        run: |
          smoke="$RUNNER_TEMP/smoke"
          mkdir -p "$smoke"
          tar -xzf "target/dist/$ARCHIVE.tar.gz" -C "$smoke"
          kg="$smoke/$ARCHIVE/bin/kg"
          cd "$smoke"
          [[ "$("$kg" --version)" == "kg $KG_VERSION" ]] || { "$kg" --version; exit 1; }
          grep -qF "\`$KG_VERSION\`" "$ARCHIVE/README.md"
          printf 'inline uint32 add_one(uint32 x)\n{\n    return x + 1;\n}\n' > add.k
          "$kg" check add.k
          "$kg" fmt --check add.k
          "$kg" board list
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ARCHIVE }}
          path: |
            target/dist/${{ env.ARCHIVE }}.tar.gz
            target/dist/${{ env.ARCHIVE }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  publish:
    name: publish the nightly
    needs: [plan, build]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The only job that writes: the `nightly` tag and its release.
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SHA: ${{ needs.plan.outputs.sha }}
      VERSION: ${{ needs.plan.outputs.version }}
      CHANGES: ${{ needs.plan.outputs.changes }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: kgrust-nightly-*
          path: dist
          merge-multiple: true
      - name: Replace the nightly prerelease
        run: |
          # One line per paragraph: a release's notes keep every newline.
          cat > notes.md <<EOF
          A nightly build of \`main\` at ${SHA:0:7} (\`kg --version\`: \`$VERSION\`).

          $CHANGES

          ## About this build

          **Not a release.** It is built automatically on nights when \`main\` has changed, checked by CI and a smoke test only, and replaced by the next one. Releases are tagged by hand after the full parity gates.

          **Without the code generator.** \`kg check\`, \`fmt\`, \`lsp\`, \`doc\`, \`explain\` and \`board list\`/\`new\` work. \`kg build\` needs \`libkanagawa-backend\`, built from source with \`scripts/build-backend.sh\` and named by \`KG_BACKEND_DIR\`.

          \`\`\`sh
          tar -xzf kgrust-nightly-<target>.tar.gz
          export PATH="\$PWD/kgrust-nightly-<target>/bin:\$PATH"
          kg --version
          \`\`\`

          - Linux x86_64 and arm64 need glibc 2.35 or later (Ubuntu 22.04 and later).
          - macOS (Apple silicon): the binaries are not signed. If a browser downloaded the archive, clear its quarantine first: \`xattr -dr com.apple.quarantine kgrust-nightly-aarch64-apple-darwin\`.
          - Each archive's \`.sha256\` is beside it.
          EOF
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly dist/* --target "$SHA" --prerelease --latest=false \
            --title "Nightly $VERSION" --notes-file notes.md
