# scripts/ci.sh as two jobs, sized for GitHub's free runners: this
# repository's Rust code — the tests, the corpus gates, clippy, the links.
# Nothing builds or runs the C++ backend (LLVM, MLIR, CIRCT) or the
# reference compiler (GHC); the tests that need them skip. The parity gates
# need both and run locally (`scripts/gates.sh`; AGENTS.md).
#
# Actions are pinned by commit, their release named beside it.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only: CI reads the repository and writes nothing back.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A pull request's superseded run is dropped; every commit on `main` is graded.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    # Linux on every push and pull request; macOS, where the project is
    # developed and measured, on `main` and by hand — its runners queue longer.
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-24.04"]' || '["ubuntu-24.04", "macos-15"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # third_party/kanagawa only — the corpus, the library, the ABI's
          # headers. Its own submodules (CIRCT, LLVM) are the backend
          # build's, not needed here.
          submodules: true
      - name: libclang (codegen --check; macOS has Xcode's)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libclang-dev
      - name: Toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Pull requests restore `main`'s cache and leave it alone.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # The action's own key hashes Cargo.toml's dependencies, not its
          # profiles, nor the profile overrides scripts/ci.sh exports. A
          # change to either rebuilt every dependency on every run while
          # the stale cache still matched in full and was never saved again
          # (2026-10-11, `split-debuginfo`).
          key: ${{ hashFiles('Cargo.toml', '.cargo/config.toml', 'scripts/ci.sh') }}
      - name: Tests and corpus gates
        run: scripts/ci.sh test

  lint:
    name: clippy and links
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: ${{ hashFiles('Cargo.toml', '.cargo/config.toml', 'scripts/ci.sh') }}
      - name: Clippy and links
        run: scripts/ci.sh lint
