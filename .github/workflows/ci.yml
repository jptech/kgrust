# scripts/ci.sh as two jobs, sized for GitHub's free runners: this
# repository's Rust code — the tests, the corpus gates, clippy, the links.
# Nothing builds or runs the C++ backend (LLVM, MLIR, CIRCT) or the
# reference compiler (GHC); the tests that need them skip. The parity gates
# need both and run locally (`scripts/gates.sh`; AGENTS.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    # Linux on every push and pull request; macOS, where the project is
    # developed and measured, on `main` and by hand — its runners queue longer.
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-24.04"]' || '["ubuntu-24.04", "macos-14"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # third_party/kanagawa only — the corpus and the library. Its own
          # submodules (CIRCT, LLVM) are the backend build's, not needed here.
          submodules: true
      - name: Toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Tests and corpus gates
        run: scripts/ci.sh test

  lint:
    name: clippy and links
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Clippy and links
        run: scripts/ci.sh lint
