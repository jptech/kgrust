<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Front Panel</title>
<!--
  A simulated board's front panel, served by the simulation itself
  (platform/sim/vboard.cpp) for any board `kg board serve` runs. Self-contained: it loads nothing from anywhere
  but the simulation, so it works offline.
-->
<style>
  :root {
    --bg: #f4f2ee; --panel: #ffffff; --ink: #1d1d1f; --muted: #6b6b70; --line: #d9d6d0;
    --pcb: #1f5f3f; --led-off: #3a3a3a; --screen: #000; --accent: #2a6fdb;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141416; --panel: #1d1d20; --ink: #ececef; --muted: #9a9aa2; --line: #2f2f34;
      --pcb: #17402b; --led-off: #2a2a2a; --accent: #6ea0ff;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141416; --panel: #1d1d20; --ink: #ececef; --muted: #9a9aa2; --line: #2f2f34;
    --pcb: #17402b; --led-off: #2a2a2a; --accent: #6ea0ff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 14px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1040px; margin: 0 auto; padding: 16px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 18px; margin: 0 0 12px; }
  .status { color: var(--muted); font-variant-numeric: tabular-nums; }
  .grid { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 16px; }
  @media (max-width: 760px) { .grid { grid-template-columns: minmax(0, 1fr); } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; min-width: 0; }
  .card h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 10px; }
  canvas { width: 100%; height: auto; aspect-ratio: 4 / 3; background: var(--screen); border-radius: 6px;
           image-rendering: pixelated; display: block; }
  .noscreen { color: var(--muted); font-size: 13px; margin-top: 8px; }
  .pcb { background: var(--pcb); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 14px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .label { color: #cfe3d6; font-size: 11px; width: 72px; overflow: hidden; text-overflow: ellipsis; }
  .led { width: 16px; height: 16px; border-radius: 50%; background: var(--led-off); box-shadow: inset 0 0 3px #000; }
  .led.on { background: #ff4d3a; box-shadow: 0 0 10px #ff4d3a; }
  .rgb { width: 22px; height: 22px; border-radius: 50%; background: var(--led-off); border: 2px solid #0b2a1a; }
  button.key { width: 40px; height: 40px; border-radius: 50%; border: 3px solid #0b2a1a; background: #d8d8d8;
               font-weight: 600; color: #333; cursor: pointer; }
  button.key.down { background: #8a8a8a; color: #fff; transform: translateY(1px); }
  .switch { width: 18px; height: 34px; border-radius: 4px; background: #0b2a1a; position: relative; cursor: pointer; border: 0; padding: 0; }
  .switch::after { content: ""; position: absolute; left: 2px; right: 2px; height: 14px; bottom: 2px;
                   background: #e5e5e5; border-radius: 3px; transition: bottom .08s; }
  .switch.on::after { bottom: 18px; background: #ffd34d; }
  .console { height: 220px; overflow: auto; background: #0e0e10; color: #d6f5d6; border-radius: 6px; padding: 8px;
             font: 12px/1.35 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; word-break: break-all; }
  .send { display: flex; gap: 6px; margin-top: 8px; }
  .send input { flex: 1; min-width: 0; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--line);
                background: var(--bg); color: var(--ink); font: 12px ui-monospace, Menlo, monospace; }
  .send button { padding: 6px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--accent);
                 color: #fff; cursor: pointer; }
  .hint { color: var(--muted); font-size: 12px; margin-top: 8px; }
  .wide { grid-column: 1 / -1; }
  .grid.single { grid-template-columns: minmax(0, 1fr); }
  .gone { color: #d9534f; }
</style>
</head>
<body>
<main>
  <header>
    <h1 id="title">Board</h1>
    <div class="status" id="status">connecting…</div>
  </header>
  <div class="grid" id="grid">
    <section class="card" id="screen-card" hidden>
      <h2 id="screen-title">Screen · 640×480</h2>
      <canvas id="screen" width="640" height="480"></canvas>
      <div class="noscreen" id="noscreen">No picture yet: the design has drawn nothing on the screen.</div>
    </section>
    <section class="card" id="board-card">
      <h2>Board</h2>
      <div class="pcb" id="pcb"></div>
      <div class="hint" id="hint"></div>
    </section>
    <section class="card wide" id="console-card" hidden>
      <h2 id="console-title">Serial console</h2>
      <div class="console" id="console"></div>
      <form class="send" id="send">
        <input id="line" autocomplete="off" placeholder="Type a line for the design; Enter sends it with CR">
        <button type="submit">Send</button>
      </form>
    </section>
  </div>
</main>
<script>
"use strict";
// Laid out from the board's resources (GET /layout): a widget per resource,
// as the generated `serve` testbench declared them (crates/kg-board/src/bench.rs).
const $ = (id) => document.getElementById(id);
const ctx = $("screen").getContext("2d");
const image = ctx.createImageData(640, 480);
let uartAt = 0, lastFrames = -1, alive = true, widgets = [], values = [], hasScreen = false;
const outputs = {};   // id -> update(value)
const inputs = {};    // id -> {value, refresh()}

function row(label) {
  const r = document.createElement("div"); r.className = "row";
  const l = document.createElement("span"); l.className = "label"; l.textContent = label;
  const cells = document.createElement("div"); cells.className = "row";
  r.append(l, cells); $("pcb").append(r);
  return cells;
}

function sendInput(id) {
  inputs[id].refresh();
  fetch(`/input?id=${id}&value=${inputs[id].value}`, { method: "POST" }).catch(() => {});
}

// The first push-button resource answers to the keyboard: W S ↑ ↓, and 1-4.
let keyed = null;
const KEYS = { w: 0, s: 1, ArrowUp: 2, ArrowDown: 3, "1": 0, "2": 1, "3": 2, "4": 3 };

function build(layout) {
  $("title").textContent = layout.board + (layout.board === "virtual" ? " board" : "");
  document.title = layout.board + " · front panel";
  const buses = [];
  for (const w of layout.widgets) {
    if (w.kind === "led" && w.style === "rgb") {
      const led = document.createElement("div"); led.className = "rgb"; led.title = w.doc;
      row(w.name).append(led);
      outputs[w.id] = (v) => {
        led.style.background = v ? `rgb(${v & 4 ? 255 : 30},${v & 2 ? 230 : 30},${v & 1 ? 255 : 30})` : "";
        led.style.boxShadow = v ? "0 0 12px currentColor" : "";
      };
    } else if (w.kind === "led") {
      const cells = row(w.name), els = [];
      for (let i = w.width - 1; i >= 0; i--) {
        const led = document.createElement("div"); led.className = "led"; led.title = `${w.name}[${i}]`;
        cells.append(led); els[i] = led;
      }
      outputs[w.id] = (v) => els.forEach((l, i) => l.classList.toggle("on", !!(v >> i & 1)));
    } else if (w.kind === "button" && w.style === "switch") {
      const cells = row(w.name), els = [];
      const input = { value: 0, refresh: () => els.forEach((s, i) => s.classList.toggle("on", !!(input.value >> i & 1))) };
      inputs[w.id] = input;
      for (let i = w.width - 1; i >= 0; i--) {
        const sw = document.createElement("button"); sw.className = "switch"; sw.title = `${w.name}[${i}]`;
        sw.onclick = () => { input.value ^= 1 << i; sendInput(w.id); };
        cells.append(sw); els[i] = sw;
      }
    } else if (w.kind === "button") {
      const cells = row(w.name), els = [];
      const input = { value: 0, refresh: () => els.forEach((b, i) => b.classList.toggle("down", !!(input.value >> i & 1))) };
      inputs[w.id] = input;
      for (let i = 0; i < w.width; i++) {
        const b = document.createElement("button"); b.className = "key"; b.textContent = i + 1; b.title = `${w.name}[${i}]`;
        const press = (down) => { input.value = down ? input.value | (1 << i) : input.value & ~(1 << i); sendInput(w.id); };
        b.onpointerdown = () => press(true); b.onpointerup = b.onpointerleave = () => press(false);
        cells.append(b); els[i] = b;
      }
      if (keyed === null) keyed = w.id;
    } else if (w.kind === "uart") {
      $("console-card").hidden = false;
      $("console-title").textContent = `Serial console · ${w.name}`;
    } else if (w.kind === "vga") {
      $("screen-card").hidden = false;
      $("screen-title").textContent = `Screen · ${w.name} · 640×480`;
      hasScreen = true;
    } else {
      buses.push(`${w.name}: ${w.doc || w.kind}`);
    }
  }
  const hints = [];
  if (keyed !== null) hints.push("Buttons: click, or keys W S ↑ ↓ (and 1–4).");
  if (Object.values(inputs).length > (keyed !== null ? 1 : 0)) hints.push("Switches: click.");
  if (buses.length) hints.push("On the buses: " + buses.join("; ") + ".");
  $("hint").textContent = hints.join(" ");
  if (!hasScreen) $("grid").classList.add("single");
}

const onKey = (down) => (e) => {
  if (keyed === null || document.activeElement === $("line")) return;
  const i = KEYS[e.key];
  if (i === undefined) return;
  e.preventDefault();
  const input = inputs[keyed], was = input.value;
  input.value = down ? input.value | (1 << i) : input.value & ~(1 << i);
  if (input.value !== was) sendInput(keyed);
};
addEventListener("keydown", onKey(true));
addEventListener("keyup", onKey(false));

$("send").onsubmit = (e) => {
  e.preventDefault();
  fetch("/uart", { method: "POST", body: $("line").value + "\r" }).catch(() => {});
  $("line").value = "";
};

const decoder = new TextDecoder();
function show(state) {
  state.values.forEach((v, id) => { if (outputs[id] && v !== values[id]) outputs[id](v); });
  values = state.values;
  if (state.uart.length) {
    const con = $("console");
    const atBottom = con.scrollTop + con.clientHeight >= con.scrollHeight - 4;
    con.textContent += decoder.decode(new Uint8Array(state.uart), { stream: true }).replace(/\r\n?/g, "\n");
    if (con.textContent.length > 200000) con.textContent = con.textContent.slice(-100000);
    if (atBottom) con.scrollTop = con.scrollHeight;
  }
  uartAt = state.uart_at;
  $("noscreen").style.display = state.screen ? "none" : "";
  $("status").textContent =
    `simulating at ${state.mhz.toFixed(2)} MHz` + (hasScreen ? ` · ${state.frames} frames` : "") + (state.screen ? ` · ${state.fps.toFixed(1)} fps` : "");
}

async function drawFrame() {
  const data = new Uint16Array(await (await fetch("/frame")).arrayBuffer());
  const px = image.data;
  for (let i = 0; i < data.length; i++) {
    const v = data[i];
    px[4 * i] = (v >> 8 & 15) * 17;
    px[4 * i + 1] = (v >> 4 & 15) * 17;
    px[4 * i + 2] = (v & 15) * 17;
    px[4 * i + 3] = 255;
  }
  ctx.putImageData(image, 0, 0);
}

async function poll() {
  try {
    const state = await (await fetch(`/state?uart=${uartAt}`)).json();
    show(state);
    if (state.screen && state.frames !== lastFrames) {
      lastFrames = state.frames;
      await drawFrame();
    }
    alive = true;
  } catch (e) {
    if (alive) $("status").innerHTML = '<span class="gone">the simulation has stopped</span>';
    alive = false;
  }
  setTimeout(poll, 50);
}

fetch("/layout").then((r) => r.json()).then((layout) => { build(layout); poll(); })
  .catch(() => { $("status").innerHTML = '<span class="gone">the simulation is not running</span>'; });
</script>
</body>
</html>
